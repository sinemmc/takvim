<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Three.js 3D Başlangıç 🎲</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { width: 100%; height: 100% }
    </style>
</head>
<body>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // 1. Sahne ve Kamera Kurulumu
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // 2. Renderer (Ekran Motoru)
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 3. 3D Obje Oluşturma (Burada hayvan yerine basit bir küp var)
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshStandardMaterial({ color: 0xff416c, roughness: 0.3 });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // 4. Işık Ekleme (Gerçekçilik için şart)
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 5, 5).normalize();
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x333333));

        camera.position.z = 5;

        // 5. Oyun/Simülasyon Döngüsü (Her saniye 60 kez çalışır)
        function animate() {
            requestAnimationFrame(animate);
            
            // Objeyi sürekli döndürerek hareket veriyoruz
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;
            
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
