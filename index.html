
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizim Çiftlik: Derbi Başladı! 🚜</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #e0f2f1 0%, #fff9c4 100%);
            font-family: 'Poppins', sans-serif;
            color: #3e2723;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(139, 195, 74, 0.3);
            max-width: 600px;
            width: 100%;
            border: 4px solid #8bc34a;
        }

        h1 {
            font-family: 'Comfortaa', cursive;
            color: #558b2f;
            text-align: center;
            margin-top: 0;
        }

        /* --- SKORBOARD VE STATUS --- */
        .dashboard {
            display: flex;
            justify-content: space-around;
            background: #f1f8e9;
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 25px;
            border: 2px dashed #8bc34a;
            font-weight: 600;
        }

        .stat-box {
            text-align: center;
        }

        .stat-box span {
            display: block;
            font-size: 1.3rem;
            color: #2e7d32;
        }

        /* --- TARLA VE EKİNLER --- */
        .field-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .plot {
            background: #795548;
            border: 4px solid #5d4037;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            position: relative;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
        }

        .plot:hover {
            transform: scale(1.02);
        }

        .plot.ready {
            background: #8bc34a;
            border-color: #689f38;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .plot-emoji {
            font-size: 3rem;
            display: block;
            margin-bottom: 10px;
        }

        /* --- BUTONLAR VE AKSİYONLAR --- */
        .btn {
            background: linear-gradient(45deg, #a1887f, #795548);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
            transition: all 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .market-section {
            background: #fff8e1;
            padding: 20px;
            border-radius: 20px;
            border: 2px solid #ffb300;
        }

        .market-title {
            font-family: 'Comfortaa', cursive;
            color: #ff8f00;
            margin-top: 0;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .market-grid {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .market-item {
            background: white;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            flex: 1;
            border: 1px solid #ffe082;
        }

        .reset-btn {
            display: block;
            width: 100%;
            background: transparent;
            color: #d32f2f;
            border: none;
            margin-top: 15px;
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Bizim Çiftlik 🚜</h1>
        
        <div class="dashboard">
            <div class="stat-box">
                <label>💰 Altın</label>
                <span id="goldText">100</span>
            </div>
            <div class="stat-box">
                <label>🌾 Buğday Deposu</label>
                <span id="wheatInventory">0</span>
            </div>
            <div class="stat-box">
                <label>🌽 Mısır Deposu</label>
                <span id="cornInventory">0</span>
            </div>
        </div>

        <div class="field-grid">
            <div class="plot" id="plot1" onclick="harvest(1)">
                <span class="plot-emoji" id="emoji1">🟫</span>
                <div id="status1">Boş Toprak</div>
                <button class="btn" onclick="plant(1, 'wheat', event)">Buğday Ek (🌾)</button>
                <button class="btn" onclick="plant(1, 'corn', event)" style="background: linear-gradient(45deg, #ffb300, #f57c00);">Mısır Ek (🌽)</button>
            </div>

            <div class="plot" id="plot2" onclick="harvest(2)">
                <span class="plot-emoji" id="emoji2">🟫</span>
                <div id="status2">Boş Toprak</div>
                <button class="btn" onclick="plant(2, 'wheat', event)">Buğday Ek (🌾)</button>
                <button class="btn" onclick="plant(2, 'corn', event)" style="background: linear-gradient(45deg, #ffb300, #f57c00);">Mısır Ek (🌽)</button>
            </div>
        </div>

        <div class="market-section">
            <h3 class="market-title">Kasaba Sipariş Panosu (Satış) 📋</h3>
            <div class="market-grid">
                <div class="market-item">
                    <span>🌾 1x Buğday</span>
                    <button class="btn" onclick="sellItem('wheat', 15)" style="background:#2e7d32; padding:5px 10px; font-size:0.85rem;">Sat (+15 💰)</button>
                </div>
                <div class="market-item">
                    <span>🌽 1x Mısır</span>
                    <button class="btn" onclick="sellItem('corn', 35)" style="background:#2e7d32; padding:5px 10px; font-size:0.85rem;">Sat (+35 💰)</button>
                </div>
            </div>
        </div>

        <button class="reset-btn" onclick="resetGame()">Çiftliği Sıfırla</button>
    </div>

    <script>
        // --- 🧠 OYUNUN NESNE YÖNELİMLİ VERİ ALTYAPISI (State Management) ---
        let farmState = {
            gold: 100,
            inventory: { wheat: 0, corn: 0 },
            plots: {
                1: { planted: null, readyAt: null, status: 'empty' },
                2: { planted: null, readyAt: null, status: 'empty' }
            }
        };

        // Ekinlerin Büyüme Süreleri (Saniye) ve Ayarları
        const cropConfig = {
            wheat: { name: 'Buğday', emoji: '🌱', readyEmoji: '🌾', duration: 5, cost: 5 },
            corn: { name: 'Mısır', emoji: '🌿', readyEmoji: '🌽', duration: 12, cost: 15 }
        };

        // --- 💾 LOCALSTORAGE ENTEGRASYONU (Tarayıcı kapansa da kaybolmaz) ---
        function saveGame() {
            localStorage.setItem('hayday_save', JSON.stringify(farmState));
        }

        function loadGame() {
            const saved = localStorage.getItem('hayday_save');
            if (saved) {
                farmState = JSON.parse(saved);
                updateUI();
                // Sayfa yenilendiğinde büyümeye devam eden ekinleri kurtar
                checkOngoingCrops();
            }
        }

        // --- 🌾 EKME MEKANİZMASI ---
        function plant(plotId, cropType, event) {
            event.stopPropagation(); // Butona basınca tarlanın kendi tıklama tetikleyicisini durdurur
            
            let plot = farmState.plots[plotId];
            if (plot.status !== 'empty') return;

            let config = cropConfig[cropType];
            if (farmState.gold < config.cost) {
                alert("Yeterli altının yok! Önce kasabada ekin satmalısın. 💰");
                return;
            }

            // Parayı düş ve tarlayı güncelle
            farmState.gold -= config.cost;
            plot.planted = cropType;
            plot.status = 'growing';
            
            const now = new Date().getTime();
            plot.readyAt = now + (config.duration * 1000);

            saveGame();
            updateUI();
            startGrowthTimer(plotId, config.duration);
        }

        // --- ⏱️ ZAMANLAYICI MOTORU (Asenkron Döngü) ---
        function startGrowthTimer(plotId, secondsLeft) {
            let timer = setInterval(() => {
                secondsLeft--;
                let plot = farmState.plots[plotId];
                
                if (secondsLeft <= 0) {
                    clearInterval(timer);
                    plot.status = 'ready';
                    saveGame();
                    updateUI();
                } else {
                    document.getElementById(`status${plotId}`).innerText = `Büyüyor... (${secondsLeft}s)`;
                }
            }, 1000);
        }

        // --- 🧺 HASAT ETME MEKANİZMASI ---
        function harvest(plotId) {
            let plot = farmState.plots[plotId];
            if (plot.status !== 'ready') return;

            let cropType = plot.planted;
            farmState.inventory[cropType]++;
            
            // Tarlayı sıfırla
            plot.status = 'empty';
            plot.planted = null;
            plot.readyAt = null;

            // Efekt patlat
            confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });

            saveGame();
            updateUI();
        }

        // --- 💰 TİCARET MOTORU ---
        function sellItem(cropType, price) {
            if (farmState.inventory[cropType] > 0) {
                farmState.inventory[cropType]--;
                farmState.gold += price;
                saveGame();
                updateUI();
            } else {
                alert(`Deponda hiç ${cropConfig[cropType].name} yok! Önce ekip biçmelisin. 🚜`);
            }
        }

        // --- 📺 INTERFACE (UI) YENİLEME MOTORU ---
        function updateUI() {
            document.getElementById('goldText').innerText = farmState.gold;
            document.getElementById('wheatInventory').innerText = farmState.inventory.wheat;
            document.getElementById('cornInventory').innerText = farmState.inventory.corn;

            for (let id in farmState.plots) {
                let plot = farmState.plots[id];
                let plotEl = document.getElementById(`plot${id}`);
                let emojiEl = document.getElementById(`emoji${id}`);
                let statusEl = document.getElementById(`status${id}`);

                if (plot.status === 'empty') {
                    plotEl.className = 'plot';
                    emojiEl.innerText = '🟫';
                    statusEl.innerText = 'Boş Toprak';
                } else if (plot.status === 'growing') {
                    plotEl.className = 'plot';
                    emojiEl.innerText = cropConfig[plot.planted].emoji;
                } else if (plot.status === 'ready') {
                    plotEl.className = 'plot ready';
                    emojiEl.innerText = cropConfig[plot.planted].readyEmoji;
                    statusEl.innerText = 'HASAT HAZIR! 🎉 (Tıkla)';
                }
            }
        }

        function checkOngoingCrops() {
            const now = new Date().getTime();
            for (let id in farmState.plots) {
                let plot = farmState.plots[id];
                if (plot.status === 'growing') {
                    let diff = Math.ceil((plot.readyAt - now) / 1000);
                    if (diff <= 0) {
                        plot.status = 'ready';
                    } else {
                        startGrowthTimer(id, diff);
                    }
                }
            }
            updateUI();
        }

        function resetGame() {
            if(confirm("Çiftliği sıfırlamak istediğine emin misin? Tüm altınlar gidecek!")) {
                localStorage.removeItem('hayday_save');
                location.reload();
            }
        }

        // Oyunu Başlat
        loadGame();
    </script>
</body>
</html>
